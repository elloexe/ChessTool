name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npm run build
      - run: npm test
      - name: Build Windows exe (portable + installer)
        working-directory: desktop
        run: |
          npm install
          npx electron-builder --win portable nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ChessTool-windows
          path: |
            desktop/release/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ChessTool-extension
          path: dist/chesstool-extension.zip
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            dist/chesstool-extension.zip
